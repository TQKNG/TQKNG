<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Khanh Nguyen profile banner</title>
  <desc id="desc">Khanh Nguyen, software engineer, curriculum content developer, and former supply chain assistant manager. Focused on AI, cloud, product engineering, and professional certifications.</desc>
