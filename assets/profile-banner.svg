<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Khanh Nguyen profile banner</title>
  <desc id="desc">Khanh Nguyen, software engineer, curriculum content developer, and former supply chain assistant manager. Focused on AI, cloud, product engineering, and professional certifications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="58%" stop-color="#111B35"/>
      <stop offset="100%" stop-color="#1B1640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <circle cx="1010" cy="125" r="190" fill="#22D3EE" opacity=".08"/>

  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M760 215C830 175 835 108 900 98S1005 140 1060 74S1130 78 1180 48" stroke-width="3" opacity=".8"/>
    <path d="M790 245C870 210 905 165 956 170S1040 205 1085 142S1140 125 1195 112" stroke-width="1.5" opacity=".45"/>
    <path d="M835 52C880 90 930 74 972 104S1060 50 1120 82S1160 140 1200 160" stroke-width="1.5" opacity=".35"/>
  </g>

  <g fill="#22D3EE">
    <circle cx="900" cy="98" r="5"/>
    <circle cx="1060" cy="74" r="6"/>
    <circle cx="1085" cy="142" r="4"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="956" cy="170" r="4"/>
    <circle cx="1120" cy="82" r="5"/>
  </g>

  <rect x="64" y="48" width="8" height="140" rx="4" fill="url(#accent)"/>
  <text x="104" y="82" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="4">KHANH NGUYEN</text>
  <text x="104" y="128" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">AI • CLOUD • PRODUCT</text>
  <text x="104" y="162" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Building useful systems for complex workflows.</text>
  <text x="104" y="202" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">BADGES AND CERTIFICATIONS</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">
    <rect x="104" y="218" width="178" height="34" rx="17" fill="#111827" stroke="#22D3EE" stroke-opacity=".8"/>
    <polygon points="124,226 127,233 135,236 127,239 124,247 121,239 113,236 121,233" fill="#22D3EE"/>
    <text x="145" y="240" fill="#E0F2FE">GITHUB COPILOT PRO</text>

    <rect x="292" y="218" width="82" height="34" rx="17" fill="#12304A" stroke="#38BDF8" stroke-opacity=".8"/>
    <text x="333" y="240" text-anchor="middle" fill="#BAE6FD">AZ-204</text>

    <rect x="384" y="218" width="82" height="34" rx="17" fill="#25204A" stroke="#A78BFA" stroke-opacity=".8"/>
    <text x="425" y="240" text-anchor="middle" fill="#DDD6FE">AI-103</text>

    <rect x="476" y="218" width="82" height="34" rx="17" fill="#421C3F" stroke="#F472B6" stroke-opacity=".8"/>
    <text x="517" y="240" text-anchor="middle" fill="#FBCFE8">PL-400</text>

    <rect x="568" y="218" width="82" height="34" rx="17" fill="#173B35" stroke="#34D399" stroke-opacity=".8"/>
    <text x="609" y="240" text-anchor="middle" fill="#BBF7D0">AB-731</text>

    <rect x="660" y="218" width="82" height="34" rx="17" fill="#49301A" stroke="#FBBF24" stroke-opacity=".8"/>
    <text x="701" y="240" text-anchor="middle" fill="#FEF3C7">AB-100</text>
